name: EduMentor AI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------
  # JOB 1: Build & Test (Frontend & Backend)
  # ---------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Build & Test Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Test Backend
        run: |
          cd backend
          # In development, you would run test scripts here
          echo "Running backend unit tests..."

      # Build & Test Frontend
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend React App
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: "/api"

  # ---------------------------------------------
  # JOB 2: Dockerize & Push Images
  # ---------------------------------------------
  dockerize-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Backend image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-backend:${{ github.sha }}

      # Build and push Frontend image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-frontend:${{ github.sha }}

  # ---------------------------------------------
  # JOB 3: Automate Deployment via SSH
  # ---------------------------------------------
  deploy:
    needs: dockerize-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Cloud VM Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Pull down latest code
            if [ ! -d "/var/www/edumentor-ai/.git" ]; then
              git clone https://github.com/${{ github.repository }} /var/www/edumentor-ai
            fi
            cd /var/www/edumentor-ai
            git pull origin main

            # Login to Docker registry
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Pull latest images
            docker-compose pull

            # Re-create and restart container services
            docker-compose up -d --remove-orphans

            # Verify system health
            docker ps
            echo "EduMentor AI system deployed successfully!"
