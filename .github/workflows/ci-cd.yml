name: EduMentor AI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------
  # JOB 1: Build & Test (Frontend & Backend)
  # ---------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Build & Test Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Test Backend
        run: |
          cd backend
          # In development, you would run test scripts here
          echo "Running backend unit tests..."

      # Build & Test Frontend
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend React App
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: "/api"

  # ---------------------------------------------
  # JOB 2: Dockerize & Push Images
  # ---------------------------------------------
  dockerize-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Backend image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-backend:${{ github.sha }}

      # Build and push Frontend image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edumentor-frontend:${{ github.sha }}

  # ---------------------------------------------
  # JOB 3: Automate Deployment via SSH
  # ---------------------------------------------
  deploy:
    needs: dockerize-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Step 3.1: Deploy Frontend container to Frontend Public VM
      - name: Deploy Frontend to Public VM Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Wait for cloud-init (user_data) to finish installing system dependencies
            echo "Waiting for VM initialization (cloud-init)..."
            while [ ! -f /var/lib/cloud/instance/boot-finished ]; do
              sleep 5
            done
            echo "VM initialized!"

            # Fail-safe: Ensure Docker and Docker Compose V2 are installed
            if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
              echo "Installing Docker and Docker Compose V2..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi

            # Pull down latest code
            if [ ! -d "/var/www/edumentor-ai/.git" ]; then
              git clone https://github.com/${{ github.repository }} /var/www/edumentor-ai
            fi
            cd /var/www/edumentor-ai
            git pull origin main

            # Generate root .env file for Frontend (needs DOCKERHUB_USERNAME and BACKEND_PRIVATE_IP)
            cat <<EOF > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            BACKEND_PRIVATE_IP=${{ secrets.BACKEND_PRIVATE_IP }}
            EOF

            # Login to Docker registry securely
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Clean up any conflicting containers
            sudo docker rm -f edumentor-frontend || true
            sudo docker rm -f $$(sudo docker ps -a -q --filter name=frontend) || true

            # Pull latest frontend image
            sudo docker compose -f docker-compose.frontend.yml pull

            # Re-create and restart frontend service
            sudo docker compose -f docker-compose.frontend.yml up -d --remove-orphans

            # Verify system health
            sudo docker ps
            echo "EduMentor AI Frontend deployed successfully!"

      # Step 3.2: Deploy Backend container to Backend Private VM (via SSH Proxy)
      - name: Deploy Backend to Private VM Server via SSH Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_PRIVATE_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          proxy_host: ${{ secrets.SERVER_HOST }}
          proxy_port: 22
          proxy_username: ${{ secrets.SERVER_USER }}
          proxy_key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Wait for cloud-init (user_data) to finish installing system dependencies
            echo "Waiting for VM initialization (cloud-init)..."
            while [ ! -f /var/lib/cloud/instance/boot-finished ]; do
              sleep 5
            done
            echo "VM initialized!"

            # Fail-safe: Ensure Docker and Docker Compose V2 are installed
            if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
              echo "Installing Docker and Docker Compose V2..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi

            # Pull down latest code
            if [ ! -d "/var/www/edumentor-ai/.git" ]; then
              git clone https://github.com/${{ github.repository }} /var/www/edumentor-ai
            fi
            cd /var/www/edumentor-ai
            git pull origin main

            # Generate root .env file from GitHub Secrets dynamically for Backend Docker Compose
            cat <<EOF > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            PORT=5000
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            EOF

            # Login to Docker registry securely
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Clean up any conflicting containers
            sudo docker rm -f edumentor-backend || true
            sudo docker rm -f $$(sudo docker ps -a -q --filter name=backend) || true

            # Pull latest backend image
            sudo docker compose -f docker-compose.backend.yml pull

            # Re-create and restart backend service
            sudo docker compose -f docker-compose.backend.yml up -d --remove-orphans

            # Verify system health
            sudo docker ps
            echo "EduMentor AI Backend deployed successfully!"
